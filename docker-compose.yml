services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: simtrader
      # SECRET-03: ':?' makes `docker compose up` abort if the value is empty,
      # instead of silently creating a superuser with a blank password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: simtrader
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simtrader"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Go backend ────────────────────────────────────────────────────────────────
  # Build context is the project root so the Dockerfile can reach both
  # simtrader/ (Go code) and psx_tracker/ (Python scripts).
  backend:
    build:
      context: .
      dockerfile: simtrader/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      ENV: production
      DATABASE_URL: postgres://simtrader:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/simtrader
      # Postgres here is on the private docker network with no TLS, so DB TLS
      # enforcement (DATA-03) is explicitly opted out for this hop only. A
      # managed/remote DB must instead use sslmode=require and drop this line.
      DB_REQUIRE_TLS: "false"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be set}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set}
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 168h
      FRONTEND_URL: ${FRONTEND_URL}
      INTERNAL_SECRET: ${INTERNAL_SECRET:?INTERNAL_SECRET must be set}
      # Mandatory admin credentials (INFRA-02): the backend refuses to boot in
      # production if these are unset, so no default admin is ever exposed.
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL must be set}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required in production (NoOpMailer leaks tokens)}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@simtrader.app}
      PSX_TRACKER_DIR: /app/psx_tracker
      PYTHON_CMD: python3
      PSX_DB_PATH: /data/psx_data.db
      # Prefixes avatar URLs (uploaded + preset) with the subpath SimTrader is
      # served under, since Caddy strips it before proxying here (see root
      # Caddyfile's `handle_path /simtrader/*`) — the browser still needs the
      # prefix to route back through Caddy correctly. Leave blank if serving
      # from the domain root.
      BASE_PATH: /simtrader
    volumes:
      - uploads:/app/uploads       # user avatar uploads
      - psx_data:/data             # SQLite database shared with psx_tracker
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── React frontend (Nginx) ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./simtrader-frontend
      args:
        # Baked into the Vite build (asset base path + router basename) — see
        # vite.config.ts. Must match the Caddyfile's `/simtrader` prefix and
        # the backend's BASE_PATH above. Leave blank to build for domain-root.
        VITE_BASE_PATH: /simtrader
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # No host port published — Caddy terminates TLS and proxies to this service
    # over the internal network (INFRA-01).
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Caddy reverse proxy — automatic HTTPS / TLS termination (INFRA-01) ─────────
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set (use localhost for local-only deployments)}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # ── PSX tracker (daily EOD scheduler) ────────────────────────────────────────
  psx_tracker:
    build: ./psx_tracker
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      SIMTRADER_URL: http://backend:8080
      INTERNAL_SECRET: ${INTERNAL_SECRET:?INTERNAL_SECRET must be set}
      PSX_DB_PATH: /data/psx_data.db
    volumes:
      - psx_data:/data             # same volume as backend so both see the SQLite DB

volumes:
  postgres_data:
  uploads:
  psx_data:
  caddy_data:
  caddy_config:
