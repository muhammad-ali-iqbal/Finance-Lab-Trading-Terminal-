# Dependency vulnerability scanning across all three ecosystems (DEP-03).
# Runs on every push/PR and on a weekly schedule so newly-disclosed CVEs in
# pinned dependencies are surfaced rather than going unnoticed.
name: security-audit

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  go:
    name: Go (govulncheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simtrader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
      - run: go vet ./...

  node:
    name: Frontend (npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simtrader-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm audit --audit-level=high

  python:
    name: PSX tracker (pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: psx_tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
