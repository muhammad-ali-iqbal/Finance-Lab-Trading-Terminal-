server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security response headers (NET-02) ────────────────────────────────────
    # Applied to every response. HSTS is intentionally NOT set here — TLS is
    # terminated by the Caddy reverse proxy in front, which owns the HSTS header
    # (setting it on a plaintext upstream hop is meaningless/misleading).
    add_header X-Frame-Options          "DENY"        always;
    add_header X-Content-Type-Options   "nosniff"     always;
    add_header Referrer-Policy          "no-referrer" always;
    # CSP for the SPA. 'unsafe-inline' on style-src is required by the bundled
    # styling; scripts are restricted to same-origin. Tighten further if the
    # build moves all styles to external files.
    add_header Content-Security-Policy  "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

    # ── Internal ingestion endpoint (NET-01) ──────────────────────────────────
    # /api/internal/* is only ever called by the psx_tracker container over the
    # internal docker network (it talks to backend:8080 directly, not via nginx).
    # Deny it from the public proxy path entirely so the shared-secret endpoint
    # is not reachable from the internet.
    location /api/internal/ {
        deny all;
        return 403;
    }

    # Proxy all /api requests to the Go backend.
    # Includes WebSocket upgrade support for the simulation live feed.
    # proxy_read_timeout is raised for long-running PSX admin commands (backfill).
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
    }

    # Proxy uploaded user avatars served as static files by the backend.
    # nosniff is enforced again here as defence-in-depth (INPUT-02).
    location /uploads/ {
        proxy_pass http://backend:8080;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA fallback — all unmatched routes serve index.html so React Router works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Lightweight health endpoint for container healthchecks.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
