server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy all /api requests to the Go backend.
    # Includes WebSocket upgrade support for the simulation live feed.
    # proxy_read_timeout is raised for long-running PSX admin commands (backfill).
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 1800s;
    }

    # Proxy uploaded user avatars served as static files by the backend.
    location /uploads/ {
        proxy_pass http://backend:8080;
    }

    # SPA fallback — all unmatched routes serve index.html so React Router works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
